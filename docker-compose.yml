services:
  mysql_easywork:
    image: mysql:8.1.0
    environment: 
      MYSQL_ROOT_PASSWORD: e4syw0rk
      MYSQL_DATABASE: easywork_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: e4syw0rk
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
  
  phpmyadmin_easywork_v2:
    image: phpmyadmin/phpmyadmin
    depends_on:
      mysql_easywork:
        condition: service_healthy
    environment:
      PMA_HOST: mysql_easywork
      PMA_USER: root
      PMA_PASSWORD: e4syw0rk
    ports:
      - "8081:80"

volumes:
  mysql_data: